name: Update podcast episodes

on:
  schedule:
    # every 24 hours
    - cron: "0 18 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-episodes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch latest episodes from YouTube
        run: python scripts/fetch_episodes.py

      - name: Commit updated episodes.json (if changed)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update latest episodes"
          file_pattern: assets/episodes.json
